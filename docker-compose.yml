# EXAMPLE compose: which variables, volumes, ports and labels the service needs. It is not kept
# in sync with the running deployment (a Portainer stack, which is the source of truth); do not
# reconcile the two in either direction.
#
# Every value is a placeholder (`XXX` for a secret, `example.com`/`example.lc` for a name, an
# RFC 5737 address for an IP), comments included; the only real value is the registry host.
# Several of these repositories are public.
#
# Deploy from the prebuilt image. The repository, service, container, Portainer stack and image are
# all named mqtt2influx; the volume note below depends on it.
#
# A bridge from MQTT into InfluxDB, with a web UI to configure and watch the streams. MQTT does not
# buffer for a subscriber that is not connected, so downtime here is data loss, not lag.

# An existing network: with `external: true` compose fails if it is missing instead of creating an
# empty one that would cut this container off from the services on it.
networks:
  docker_main_net:
    external: true

# The volume holds streams.json, the service's whole configuration (every stream and its
# credentials); an empty volume is a bridge that writes nothing.
#
# The key is `data`: compose prefixes it with the project name, which Portainer takes from the stack
# name, giving `mqtt2influx_data`. A key of `mqtt2influx_data` would ask for
# `mqtt2influx_mqtt2influx_data`, a new, empty volume.
#
# `DATA_DIR` in `environment:` and the `- data:/app/data` mount are two halves of one fact: moving
# one without the other makes the app write into the container's writable layer, which the next
# image update deletes. Change both in one StackUpdate.
#
# Renaming the stack detaches the data the same way; pin the volume first (`external: true` plus
# `name: mqtt2influx_data`).
volumes:
  data:

services:
  mqtt2influx:
    image: gitea.vvzvlad.xyz/projects/mqtt2influx:latest
    container_name: mqtt2influx
    # `always`, not `unless-stopped`: after a host reboot or a daemon restart, `unless-stopped`
    # silently leaves down a container that was once stopped by hand.
    restart: always
    # Docker's default 10 s is too short. manager.stop_all() stops every stream in parallel, and one
    # stream's worst case is the MQTT disconnect wait (MQTT_TIMEOUT, 10 s) followed by the final
    # flush (ClientTimeout 10 s); 30 s covers that with margin and does not scale with the streams.
    stop_grace_period: 30s
    # The entrypoint starts as root to chown the volume, then drops to uid 1000 with gosu;
    # `no-new-privileges` only blocks a way back up through setuid binaries. Do not add a `user:`
    # override: it skips the chown, and the entrypoint refuses to start on a volume it cannot write.
    security_opt:
      - no-new-privileges:true
    networks:
      - docker_main_net
    ports:
      # Straight onto the host's LAN address, no Traefik: the UI is http://<host>:8111. The
      # right-hand side is the app's port (PORT, default 8000).
      - "8111:8000"
    environment:
      # Flush after BATCH_SIZE points or BATCH_INTERVAL seconds, whichever comes first; read once at
      # import. Above the 100/1.0 defaults to keep the InfluxDB write rate down at a high load.
      BATCH_SIZE: 220
      BATCH_INTERVAL: 3
      # Fleet convention; nothing the service prints is a formatted local time.
      TZ: Europe/Moscow
      # Explicit although it is the image's default: an auto-updated stack must not depend on what a
      # future image defaults to. Read once at import.
      DATA_DIR: /app/data
    volumes:
      # Must stay in step with DATA_DIR above (see the top-level `volumes:` note).
      - data:/app/data
    logging:
      # Caps the json-file log at 5 x 10m = 50 MB; uncapped it grows until the disk is full.
      driver: "json-file"
      options:
        max-file: 5
        max-size: 10m
    labels:
      # The label the fleet's Portainer image updater watches: a :latest pushed by
      # image-check-publish.yml rolls out on its own, so its smoke gate is the last stop.
      io.portainer.update.enable: "true"
    healthcheck:
      # No curl in the image, so python probes. /api/stats answers 200 with `[]` even with no stream
      # running, as on a fresh volume.
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          with urllib.request.urlopen("http://127.0.0.1:8000/api/stats", timeout=3) as response:
              sys.exit(0 if response.status == 200 else 1)
      # Portainer's image updater rolls the image back unless the recreated container turns healthy
      # within 120 s; a long interval makes every update revert.
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
