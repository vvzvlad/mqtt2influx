name: Docker Image CI

# The publishing half of the pair: test suite, image build, smoke gate, then login and push. No
# `pull_request` trigger, so a PR branch can never move :latest, which production follows through
# `io.portainer.update.enable` (see docker-compose.yml); tests.yml checks PRs without pushing.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read   # checkout

# Serialised so that the newest commit's :latest is written last. Not cancelled: that would lose the
# running commit's :<sha> image, its rollback point. Gitea before 1.24 silently ignores this block.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # A label advertised by the instance-level runner, not the runner's name.
    runs-on: ubuntu-latest
    # Above the 15-minute suite step: when this fires, act_runner kills the job and the
    # `if: always()` cleanup may not run, leaving the container on the shared daemon.
    timeout-minutes: 25
    # Job-level so the steps that create and remove the test container use one name. The run id
    # keeps concurrent runs on the shared daemon apart; jobs inherit nothing, so `build` repeats it.
    env:
      SMOKE_NAME: mqtt2influx-smoke-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7
      with:
        # Full history and tags. No step reads them; the checkout matches the other workflow's.
        fetch-depth: 0
    - name: Run the test suite
      # Runs in python:3.11-slim, the application image's base, rather than via setup-python. The
      # tree goes in as a tar on stdin: the daemon is outside act_runner's container, and a bind
      # mount would mount an empty directory. Byte-identical to the step in tests.yml.
      timeout-minutes: 15
      run: |
        # `set -e` so a failed pip aborts instead of running pytest against a half-installed
        # environment; `pipefail` so a `tar` that dies mid-stream is not masked by the exit status
        # of the docker command reading from it.
        set -e
        set -o pipefail
        # A UI re-run reuses the run id, so an attempt killed by the step timeout may have left this
        # container behind; `-v` takes any anonymous volume with it.
        docker rm -f -v "$SMOKE_NAME-tests" || true
        # Not shipped: .git, .roo, .venv and __pycache__ (built for another interpreter), and data/
        # and .env, which hold a workstation's real streams.json and settings when run by hand.
        # --pull always: the runner's daemon is persistent, so a cached base image would go stale.
        tar --exclude=./.git --exclude=./.venv --exclude=./data --exclude=./.env --exclude=./.roo --exclude=__pycache__ -cf - . \
          | docker run --rm -i --pull always --name "$SMOKE_NAME-tests" -w /w \
              python:3.11-slim bash -c '
          set -e
          tar -xf -
          pip install --no-cache-dir -r requirements-dev.txt
          # No -q: pytest.ini already sets `addopts = -q`, and at -qq pytest drops the `N passed`
          # summary, the only count of what ran.
          pytest --tb=short
        '
    - name: Remove the test container from the runner
      # For a run killed by its step timeout, which stops the docker client but not the container:
      # `--rm` only fires when the container exits. Best-effort; byte-identical to the step in
      # tests.yml.
      if: always()
      run: |
        docker rm -f -v "$SMOKE_NAME-tests" || true

  build:
    # A red suite stops the pipeline before the build, so nothing reaches the registry.
    needs: test
    runs-on: ubuntu-latest
    # Above the step timeouts below (20 build + 40 smoke + 15 push) plus the other steps: when this
    # fires, act_runner kills the job and the `if: always()` cleanups and logout may not run.
    timeout-minutes: 90
    # ci/smoke.py names its container after this and refuses to start without it; the cleanup step
    # removes the container by the same name.
    env:
      SMOKE_NAME: mqtt2influx-smoke-${{ github.run_id }}
    steps:
    - uses: actions/checkout@v7
      with:
        # Each job has its own workspace, so `build` checks out again, the same way `test` does.
        fetch-depth: 0
    - name: Compute image tags
      id: tags
      # main -> :<sha> and :latest (production follows :latest), any other branch -> :<branch>. The
      # `main` below and the `branches:` filter at the top must both name the default branch.
      env:
        # Through the environment, not interpolated into the script: git allows `$(...)` in a branch
        # name, and interpolated it would run on the shared runner.
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
      run: |
        # Docker rejects uppercase in an image path; Gitea allows it in repository names. $REPO is
        # projects/mqtt2influx here, which docker-compose.yml's hand-written `image:` line repeats.
        IMAGE="gitea.vvzvlad.xyz/$(printf '%s' "$REPO" | tr 'A-Z' 'a-z')"
        if [ "$REF_NAME" = "main" ]; then
          # Order matters: the push step goes left to right, so a failed :<sha> push stops the run
          # before :latest, the tag production follows, moves.
          echo "tags=$IMAGE:$SHA $IMAGE:latest" >> "$GITHUB_OUTPUT"
          # The gate tests :<sha>, the one tag that can only mean this commit's image.
          echo "smoke=$IMAGE:$SHA" >> "$GITHUB_OUTPUT"
        else
          # A docker tag matches [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}: other characters become `-`, an
          # illegal first character becomes `_`, and the result is cut to 100 characters.
          branch_tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[^A-Za-z0-9_]/_/' | cut -c1-100)
          # A branch named `latest` must not produce the tag production follows.
          if [ "$branch_tag" = "latest" ]; then
            branch_tag="branch-latest"
          fi
          echo "tags=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
          echo "smoke=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
        fi
    - name: Build the Docker image
      # act_runner enforces step-level timeouts; 20 minutes covers a cold build of the small, pinned
      # dependency set on python:3.11-slim.
      timeout-minutes: 20
      env:
        # Through the environment, not interpolated into the script. A space-separated list, left
        # unquoted below so that word splitting yields one tag per item.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        set -e
        # Count the tags after word splitting: a whitespace-only $TAGS passes `[ -n "$TAGS" ]` and
        # would build an untagged image that nothing can remove by name.
        set -- $TAGS
        [ "$#" -gt 0 ] || { echo "No tags to build: the tag-computation step produced no usable output. Refusing to build an image that nothing could name, push or remove." >&2; exit 1; }
        tag_args=""
        for tag in "$@"; do tag_args="$tag_args --tag $tag"; done
        # --pull: the runner's daemon is persistent, so a cached python:3.11-slim would go stale.
        # BuildKit, the default builder, caches outside what the image cleanup step frees.
        docker build --pull . --file Dockerfile $tag_args
    - name: Smoke-test the built image
      # The gate, between build and push: a red smoke leaves production on the previous image. The
      # ci/smoke.py docstring describes the checks. The runner's job image has `python3` but no bare
      # `python`.
      # Worst case, with every docker call in ci/smoke.py at its bound: about 15 minutes (870 s).
      timeout-minutes: 40
      env:
        SMOKE_IMAGE: ${{ steps.tags.outputs.smoke }}
      # Byte-identical to the step in tests.yml.
      run: |
        python3 ci/smoke.py
    - name: Log in to the Gitea container registry
      # Only after the build and the gate, which run third-party code on the shared runner, so the
      # credential is not in the job's docker config while they run.
      uses: docker/login-action@v4
      with:
        registry: gitea.vvzvlad.xyz
        username: ${{ github.repository_owner }}
        # An organisation secret holding a PAT with `write:package`; the built-in Gitea token has no
        # package scope.
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Push Docker images
      # 15 minutes. The image is small, so this is generous on purpose: a bound too tight would abort
      # a push that was making perfectly good progress, leaving a half-pushed :<sha> and no :latest.
      timeout-minutes: 15
      env:
        # Same reasoning as in the build step: pass the tags through the environment, and leave
        # `$TAGS` unquoted so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        # -e: a failed :<sha> push stops the loop before :latest, whatever shell options the runner
        # applies to `run:`.
        set -e
        # Count the tags after word splitting, as in the build step: a whitespace-only $TAGS would
        # otherwise push nothing and report success.
        set -- $TAGS
        [ "$#" -gt 0 ] || { echo "No tags to push: the tag-computation step produced no usable output. Refusing to report a successful push that pushed nothing — :latest would stay on the previous image and look deployed." >&2; exit 1; }
        for tag in "$@"; do docker push "$tag"; done
    - name: Remove the smoke containers from the runner
      # ci/smoke.py removes its container itself; this catches a run killed by a timeout or a cancel
      # before that. Before the image cleanup, because a leftover container pins the image.
      if: always()
      run: |
        # The name ci/smoke.py gives its container (SERVE_SUFFIX).
        docker rm -f -v "$SMOKE_NAME-serve" || true
    - name: Remove the built images from the runner
      # Removes only the tags this run created; no prune, since the daemon is shared. The BuildKit
      # cache and dangling base images left by --pull need a periodic cleanup on the runner host.
      if: always()
      env:
        # Same reasoning as in the build step: pass the tags through the environment, and leave
        # `$TAGS` unquoted so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        # An empty $TAGS means nothing was built, so removing nothing is correct here.
        for tag in $TAGS; do docker rmi "$tag" || true; done
    - name: Log out of the Gitea container registry
      # `docker login` leaves the credential in a docker config that outlives the job on the shared
      # runner; `always()` and last, so it is removed however the run ends.
      if: always()
      run: |
        # `|| true`: a run that failed before the login has nothing to log out of.
        docker logout gitea.vvzvlad.xyz || true
