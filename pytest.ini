[pytest]
# Only tests/ is collected. Without this pytest would also walk .venv/ looking for test files.
testpaths = tests

# Put the project root on sys.path so `from src.config import ...` resolves the same way it does
# when main.py runs `uvicorn.run("src.api:app")`. There is no installed package and no src layout
# here — src/ is imported straight from the working tree, in the tests exactly as in production.
pythonpath = .

# Run every `async def` test without marking each one. Note that pytest does NOT strip inline
# comments from ini values: a trailing comment on this line becomes part of the mode string, which
# is not one of the accepted values, and collection of the whole suite fails.
asyncio_mode = auto

# One fresh event loop per test. The default is the same, but pytest-asyncio warns on every run
# until the scope is stated explicitly, and a suite that always prints a warning is a suite whose
# warnings nobody reads.
asyncio_default_fixture_loop_scope = function

addopts = -q
