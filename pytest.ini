[pytest]
# Only tests/ is collected. Without this pytest would also walk .venv/ looking for test files.
testpaths = tests

# Put the project root on sys.path so `from src.config import ...` resolves the same way it does
# when main.py runs `uvicorn.run("src.api:app")`. There is no installed package and no src layout
# here — src/ is imported straight from the working tree, in the tests exactly as in production.
pythonpath = .

addopts = -q
